{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ночная Земля — города, история, производство</title>
  <meta name="description" content="Интерактивный 3D-глобус ночной Земли: города, их история, крупные компании и производство. Русский, узбекский и каракалпакский языки.">
  <meta name="theme-color" content="#04070f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300..600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950: '#04070f', 900: '#070c17', 800: '#0c1424', 700: '#141e33' },
            lamp: { 300: '#ffd08a', 400: '#ffbf66', 500: '#ffaa3d' }
          },
          fontFamily: {
            serif: ['Literata', 'Georgia', 'Times New Roman', 'serif'],
            sans: ['"Source Sans 3"', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body class="bg-ink-950 font-sans text-slate-200 antialiased">

  <!-- Шапка: название и переключатель языков -->
  <header class="fixed inset-x-0 top-0 z-40 flex h-14 items-center justify-between border-b border-white/[0.06] bg-ink-950/70 px-4 backdrop-blur-md sm:px-6">
    <a href="{% url 'index' %}" class="flex items-center gap-3 rounded-md">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="flex items-baseline gap-3">
        <span class="font-serif text-lg font-light tracking-wide text-white" data-i18n="brandName">Ночная Земля</span>
        <span class="hidden text-sm text-slate-500 md:inline" data-i18n="brandTagline">Города, история и производство</span>
      </span>
    </a>

    <div id="lang-switch" role="group" aria-label="Язык интерфейса" data-i18n-aria="langGroup"
         class="inline-flex rounded-full border border-white/10 bg-white/[0.04] p-0.5">
      {% for code, short, native, html_lang in languages %}
      <button type="button" data-lang="{{ code }}" lang="{{ html_lang }}" title="{{ native }}" aria-pressed="false"
              class="rounded-full px-3 py-1 text-xs font-semibold tracking-wide text-slate-400 transition-colors hover:text-white aria-pressed:bg-lamp-400 aria-pressed:text-ink-950">{{ short }}</button>
      {% endfor %}
    </div>
  </header>

  <main id="stage" class="stage">
    <!-- Глобус -->
    <div id="globe-wrap" class="globe-wrap">
      <div id="globe" class="globe" role="application" aria-label="Интерактивный глобус" data-i18n-aria="globeLabel"></div>

      <p id="hint" data-hidden="false"
         class="pointer-events-none absolute left-1/2 top-5 z-10 max-w-[88%] -translate-x-1/2 text-center text-sm text-slate-400 transition-opacity duration-700 data-[hidden=true]:opacity-0"
         data-i18n="hint">Нажмите на страну, чтобы увидеть её города</p>

      <!-- Плашка выбранной страны: появляется, когда глобус приближен к стране -->
      <div id="country-bar" class="country-bar" data-open="false">
        <button id="country-back" type="button" class="country-bar__back">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 2.5L4 7l4.5 4.5"/></svg>
          <span data-i18n="backToWorld">Весь мир</span>
        </button>
        <span class="country-bar__name" id="country-name"></span>
        <span class="country-bar__count" id="country-count"></span>
      </div>

      <!-- Поиск по городам и странам: кнопка в углу -->
      <div id="search" class="search" data-open="false">
        <div id="search-popup" class="search__popup" role="dialog" aria-label="Поиск" data-i18n-aria="searchTitle">
          <label class="search__field">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17"/></svg>
            <input id="search-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                   placeholder="Найти город или страну" data-i18n-placeholder="searchPlaceholder"
                   aria-label="Найти город или страну" data-i18n-aria="searchPlaceholder">
          </label>
          <div id="search-results" class="search__results"></div>
        </div>
        <button id="search-toggle" type="button" class="search__toggle" aria-expanded="false" aria-controls="search-popup"
                aria-label="Поиск городов и стран" data-i18n-aria="searchOpen">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17"/></svg>
        </button>
      </div>

      <!-- Лента времени: события из историй городов по годам -->
      <div id="timeline" class="tl" data-open="false">
        <section id="tl-bar" class="tl__bar" aria-label="Путешествие во времени" data-i18n-aria="timelineTitle">
          <button id="tl-close" type="button" class="tl__close" aria-label="Закрыть ленту времени" data-i18n-aria="timelineClose">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg>
          </button>
          <div class="tl__top">
            <p id="tl-year" class="tl__year"></p>
            <p id="tl-place" class="tl__place"></p>
          </div>
          <p id="tl-text" class="tl__text" aria-live="polite"></p>
          <div class="tl__controls">
            <button id="tl-prev" type="button" class="tl__btn" aria-label="Предыдущее событие" data-i18n-aria="timelinePrev">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3.5L5.5 8l5 4.5"/></svg>
            </button>
            <button id="tl-play" type="button" class="tl__btn tl__btn--play" data-playing="false" aria-label="Запустить">
              <svg class="icon-play" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.3v9.4L12.6 8z" fill="currentColor"/></svg>
              <svg class="icon-pause" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="3" height="10" rx="0.8" fill="currentColor"/><rect x="9" y="3" width="3" height="10" rx="0.8" fill="currentColor"/></svg>
            </button>
            <button id="tl-next" type="button" class="tl__btn" aria-label="Следующее событие" data-i18n-aria="timelineNext">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5L10.5 8l-5 4.5"/></svg>
            </button>
            <input id="tl-range" type="range" min="0" max="0" step="1" value="0" class="tl__range"
                   aria-label="Событие на ленте времени" data-i18n-aria="timelineRange">
            <span id="tl-count" class="tl__count"></span>
            <button id="tl-open" type="button" class="tl__open" data-i18n="timelineOpenCity">Открыть город</button>
          </div>
        </section>
        <button id="tl-toggle" type="button" class="tl__toggle" aria-expanded="false" aria-controls="tl-bar"
                aria-label="Лента времени" data-i18n-aria="timelineOpen">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4.2l2.8 1.8"/></svg>
        </button>
      </div>

      <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="loader__dot" aria-hidden="true"></div>
        <p class="mt-6 text-sm text-slate-400" data-i18n="loading">Загружаем глобус…</p>
      </div>

      <div id="toast" class="toast" role="alert" data-open="false">
        <span id="toast-text"></span>
        <button id="toast-retry" type="button"
                class="shrink-0 rounded-full border border-lamp-400/50 px-3 py-1 text-lamp-300 transition-colors hover:bg-lamp-400/10"
                data-i18n="retry">Повторить</button>
      </div>
    </div>

    <!-- Боковая панель (на телефоне выезжает снизу) -->
    <aside id="panel" class="panel" role="complementary" aria-labelledby="panel-title" aria-hidden="true" inert>
      <button id="panel-close" type="button" aria-label="Закрыть панель" data-i18n-aria="close"
              class="absolute right-4 top-4 z-10 grid h-9 w-9 place-items-center rounded-full border border-white/10 bg-white/[0.04] text-slate-300 transition-colors hover:border-lamp-400/50 hover:text-white">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M2 2l10 10M12 2L2 12"/>
        </svg>
      </button>
      <div id="panel-content" class="panel__scroll"></div>
    </aside>
  </main>

  <noscript>
    <p class="fixed inset-0 z-50 grid place-items-center bg-ink-950 p-8 text-center text-slate-300">
      Для работы 3D-глобуса необходим JavaScript.
    </p>
  </noscript>

  <script>
    window.APP_CONFIG = {
      urls: {
        cities: "{% url 'city-list' %}",
        countries: "{% url 'country-list' %}",
        timeline: "{% url 'timeline' %}",
        // «0» в конце заменяется на id города в app.js
        cityDetail: "{% url 'city-detail' id=0 %}",
        countriesGeoJson: "{% static 'data/countries.geojson' %}"
      },
      textures: {
        earth: "https://cdn.jsdelivr.net/npm/three-globe@2.45.3/example/img/earth-dark.jpg",
        sky: "https://cdn.jsdelivr.net/npm/three-globe@2.45.3/example/img/night-sky.png"
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
